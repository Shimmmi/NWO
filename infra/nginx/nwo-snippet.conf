# WORLD ORDER (NWO) — nginx snippet for shimmirpgbot.ru
#
# Куда вставлять: /etc/nginx/sites-available/waifu-bot, внутрь
# server { listen 443 ssl http2; server_name shimmirpgbot.ru ...; }
# Этот файл должен совпадать с живым конфигом байт в байт.
#
# ------------------------------------------------------------------------------
# ШАГ 1 (обязателен ДО вставки блоков ниже) — map на уровне http {}
# ------------------------------------------------------------------------------
# В /etc/nginx/nginx.conf внутрь http {} или отдельным файлом
# /etc/nginx/conf.d/upgrade-map.conf:
#
#     map $http_upgrade $connection_upgrade {
#         default upgrade;
#         ''      close;
#     }
#
# В живом конфиге такого map сейчас НЕТ — проверено: `grep -rn "connection_upgrade"
# /etc/nginx/` не даёт ни одного совпадения. Без него nginx не пройдёт `nginx -t`
# и упадёт на "unknown variable connection_upgrade".
# map инертен, пока на переменную никто не ссылается, поэтому добавление
# безопасно для соседних вхостов (waifu-bot, waifu-bot-stage, aerocalc).
#
# ------------------------------------------------------------------------------
# ШАГ 2 — вставить блоки location ниже
# ------------------------------------------------------------------------------
#
# ШАГ 3 — применить. Именно в этом порядке и НИКОГДА не restart:
#     sudo nginx -t && sudo systemctl reload nginx
# Файл общий с проектами waifu-bot и aerocalc: restart уронит и их,
# reload подхватывает конфиг без разрыва соединений.
#
# Порядок применения относительно докера: nginx перезагружается ПОСЛЕ того, как
# новый контейнер стал healthy, иначе /nwo/ws какое-то время ведёт в никуда.
#
# Замечания:
# - nginx НЕ срезает префикс: до сервера доедет полный путь /nwo/ws. Именно с ним
#   сверяется upgrade-хендлер в server/app-server.ts.
# - /nwo/ws идёт до /nwo/ : при префиксном матчинге побеждает более длинный
#   префикс независимо от порядка, но явный порядок читается лучше.
# - Порт 3001 больше не существует: HTTP и WebSocket обслуживает один процесс
#   на 3000.

location /nwo/ws {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
}

location /nwo/ {
    proxy_pass http://127.0.0.1:3000/nwo/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /nwo {
    proxy_pass http://127.0.0.1:3000/nwo;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
